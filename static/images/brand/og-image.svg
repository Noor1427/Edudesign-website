<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="EduDesign UK">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#FAF4F7"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EC6A9C"/><stop offset="1" stop-color="#E14C82"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="220" fill="#FCE7F0" opacity="0.6"/>
  <circle cx="150" cy="560" r="180" fill="#E7EFFC" opacity="0.6"/>

  <g transform="translate(90,150)">
    <circle cx="60" cy="60" r="58" fill="#fff" stroke="url(#pink)" stroke-width="3"/>
    <text x="60" y="84" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="56" font-weight="700" fill="#E14C82">ed</text>
  </g>

  <text x="230" y="232" font-family="'Segoe UI', Arial, sans-serif" font-size="58" font-weight="800" fill="#1B2435">EduDesign <tspan fill="#E14C82">UK</tspan></text>

  <text x="92" y="350" font-family="'Segoe UI', Arial, sans-serif" font-size="40" font-weight="700" fill="#1B2435">Academic, Career &amp; Digital Solutions</text>
  <text x="92" y="406" font-family="'Segoe UI', Arial, sans-serif" font-size="40" font-weight="700" fill="#E14C82">— all in one place</text>

  <text x="92" y="478" font-family="'Segoe UI', Arial, sans-serif" font-size="25" fill="#4B566C">Academic support · CVs · Coding · Data analytics · Websites · Branding</text>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600">
    <rect x="92"  y="520" width="250" height="56" rx="28" fill="#E14C82"/>
    <text x="217" y="556" text-anchor="middle" fill="#fff">For Students &amp; Graduates</text>
    <rect x="360" y="520" width="230" height="56" rx="28" fill="#1B2435"/>
    <text x="475" y="556" text-anchor="middle" fill="#fff">For Small Businesses</text>
  </g>
</svg>
