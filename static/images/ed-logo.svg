<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="EduDesign UK">
  <defs>
    <linearGradient id="edstar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fc0"/>
      <stop offset="1" stop-color="#d23f86"/>
    </linearGradient>
  </defs>

  <!-- pink ring -->
  <circle cx="100" cy="100" r="91" fill="#ffffff" stroke="#F58FBB" stroke-width="3"/>

  <!-- ed monogram (navy) -->
  <text x="96" y="120" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-style="italic" font-weight="700" font-size="82" fill="#16244e">ed</text>

  <!-- pink star on the d -->
  <path d="M135,52 L138.14,61.67 L148.3,61.67 L140.09,67.65 L143.23,77.33 L135,71.35 L126.77,77.33 L129.91,67.65 L121.7,61.67 L131.86,61.67 Z" fill="url(#edstar)"/>

  <!-- UK -->
  <text x="100" y="156" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
        font-weight="700" font-size="28" letter-spacing="2" fill="#F58FBB">UK</text>
</svg>
