<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="EduDesign UK">
  <defs>
    <linearGradient id="edg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e98fb0"/>
      <stop offset="1" stop-color="#c75d86"/>
    </linearGradient>
    <path id="edArc" d="M44,150 A64,64 0 0 0 156,150" fill="none"/>
  </defs>

  <!-- outer ring -->
  <circle cx="100" cy="100" r="95" fill="#ffffff"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#edg)" stroke-width="2.2"/>

  <!-- ed monogram -->
  <text x="99" y="132" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-style="italic" font-weight="600" font-size="96" fill="url(#edg)">ed</text>

  <!-- pen-nib accent on the d stem -->
  <path d="M120,120 L130,120 L125,150 Z" fill="url(#edg)"/>
  <line x1="125" y1="128" x2="125" y2="146" stroke="#ffffff" stroke-width="1.4"/>

  <!-- four-point sparkle -->
  <path d="M150,52 L154.5,62 165,66 154.5,70 150,80 145.5,70 135,66 145.5,62 Z" fill="url(#edg)"/>

  <!-- curved wordmark -->
  <text font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="3.5"
        font-weight="500" fill="url(#edg)">
    <textPath href="#edArc" startOffset="50%" text-anchor="middle">EDUDESIGN&#160;UK</textPath>
  </text>

  <!-- ring dots at the ends of the wordmark -->
  <circle cx="44" cy="150" r="3.2" fill="url(#edg)"/>
  <circle cx="156" cy="150" r="3.2" fill="url(#edg)"/>
</svg>
